# Netlify configuration for Karkas.
# Production deploys are driven by .github/workflows/deploy-hosting.yml (netlify-cli),
# but this file also lets Netlify build the site directly from the connected repo.

[build]
  command = "npm run build"
  publish = "dist/karkas/browser"

[build.environment]
  NODE_VERSION = "22"

# Branch/preview deploys use the staging configuration.
[context.deploy-preview]
  command = "npm run build:staging"

[context.branch-deploy]
  command = "npm run build:staging"

# Future backend integration: proxy /api/* to the API host so the frontend can
# call a same-origin URL (see environment.apiBaseUrl). Uncomment once the
# backend from issue #75 exists.
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.example.com/api/:splat"
#   status = 200

# SPA fallback — serve index.html for all routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker script must never be cached aggressively.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
