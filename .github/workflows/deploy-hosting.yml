name: Deploy to Netlify

# Dedicated-hosting deployment (issue #74). Replaces GitHub Pages as the
# primary deployment target; deploy-pages.yml is kept until the DNS cutover
# is complete (see docs/deployment.md).

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        default: staging
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npm run build
          else
            npm run build:staging
          fi

      - name: Generate build.txt
        run: |
          node -e "
            const pkg = require('./package.json');
            const now = new Date().toISOString();
            const deps = Object.entries(pkg.dependencies || {})
              .map(([name, version]) => '  ' + name + ': ' + version)
              .join('\n');
            const content =
              'Project: ' + pkg.name + '\n' +
              'Version: ' + pkg.version + '\n' +
              'Description: ' + (pkg.description || '') + '\n' +
              'Environment: ' + process.env.DEPLOY_ENV + '\n' +
              '\n' +
              'Dependencies:\n' + deps + '\n' +
              '\n' +
              'Deployed: ' + now + '\n';
            require('fs').writeFileSync('dist/karkas/browser/build.txt', content);
          "

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx netlify-cli deploy --dir dist/karkas/browser --prod --message "$GITHUB_SHA"
          else
            npx netlify-cli deploy --dir dist/karkas/browser --alias staging --message "$GITHUB_SHA (staging)"
          fi
